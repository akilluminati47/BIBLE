# PlayStation2 Basic Bootloader config file
# BIBLE (github.com/akilluminati47/BIBLE): PS2BBL Extended's config, plus BIBLE's own keys below.
# Hold L2 + R2 at power on: BIBLE pauses on the launch keys page and shows every key's current path(s) before anything
# starts. Hold TRIANGLE + CROSS for the video mode page.
##################################
# Configurations:                #
##################################
EJECT_TRAY = 0
OSDHISTORY_READ = 0
KEY_READ_WAIT_TIME = 6000
# LOGO_DISPLAY  0=off, 1=info, 2=logo & info, 3=banner & NAME_<BUTTON>, 4=banner & scanned filename, 5=banner & scanned path
LOGO_DISPLAY = 3
# CDROM_DISABLE_GAMEID: 1 disables visual game ID for discs (cdrom)
CDROM_DISABLE_GAMEID = 0
# APP_GAMEID: 1 enables RetroGem visual game ID for apps/homebrew (also forced by -appid or -titleid=)
APP_GAMEID = 1
# DISC_STOP: 1 stops optical disc after config discovery ; 0 keeps default PS2 behavior
DISC_STOP = 1

##################################
# BIBLE's own keys               #
##################################
# VIDEO_MODE: AUTO (RIPPS2's Video Mode when its settings are found, else the console's own), NTSC, PAL, 480P, 576P,
# 720P or 1080I
VIDEO_MODE = AUTO
# BIBLE_BACKGROUND: AUTO (RIPPS2's sky when its settings are found or BIBLE_COLOR is set, else black, a plain boot
# loader), SKY (always the sky) or BLANK (always black)
BIBLE_BACKGROUND = AUTO
# BIBLE_COLOR: the sky by hand, top,horizon,floor as RRGGBB (unset: RIPPS2's Color Theme, else RIPPS2's blue)
# BIBLE_COLOR = 010209,0B194C,020410
# BIBLE_GLYPHS: buttons under the logo: 0 none, 1 the face buttons, 2 all sixteen
BIBLE_GLYPHS = 1
# BIBLE_INFO: 1 shows the countdown, clock and console details on the splash
BIBLE_INFO = 0
# BIBLE_WIDESCREEN: AUTO (RIPPS2's Widescreen, else the PS2's TV Screen 16:9 setting), ON or OFF
BIBLE_WIDESCREEN = AUTO
# Boot sound: a boot.adp in this folder (RIPPS2's Boot Sound On (fast) puts it here) is read while the splash counts
# down and handed to RIPPS2 in RAM, so it plays with RIPPS2's first frame. BIBLE waits at the launch for whatever is
# still unread, so with KEY_READ_WAIT_TIME = 0 (or LOGO_DISPLAY = 0) the whole read (about 2 s for 360 KB on a memory
# card) comes before RIPPS2 starts. Silent (no boot.adp here, Boot Sound Off in RIPPS2) is the fastest boot.

##################################
# Add additional IRXs as needed. ORDER MATTERS
##################################
LOAD_IRX_E1 =
LOAD_IRX_E2 =
LOAD_IRX_E3 =
LOAD_IRX_E4 =
LOAD_IRX_E5 =

##################################
# RIPPS2, then Hacked OSDSYS or wLE ISR exFAT:
# BIBLE tries RIPPS2 first (a memory card's RIPPS2 folder, then an SD2PSX / MMCE card's APPS folder); without it,
# the next entry starts. Delete SYS_HackedOSDSYS in MC BROWSER/wLE in order to fall on the desired app on power on,
# or add your own as desired. L2 will let you get back to HACKED OSDSYS/OSDSYS.
##################################
NAME_AUTO = RIPPS2 / OSDMenu / FMCB
LK_AUTO_E1 = mc?:/RIPPS2/RIPPS2.ELF
LK_AUTO_E2 = mmce?:/APPS/RIPPS2.ELF
LK_AUTO_E3 = mc?:/SYS_OSDMENU/osdmenu.elf
LK_AUTO_E4 = mc?:/SYS_FMCBD-1966/FMCBD-1966.ELF
LK_AUTO_E5 = mc?:/SYS_FMCBD-1965/FMCBD-1965.ELF
LK_AUTO_E6 = mc?:/SYS_FMCBD-1953/FMCBD-1953.ELF
LK_AUTO_E7 = mc?:/SYS_FMCBD-18C/FMCBD-18C.ELF
LK_AUTO_E8 = mc?:/BOOT/BOOT2.ELF
LK_AUTO_E9 = $OSDSYS

##################################
# Disc Hotkeys                   #
##################################
NAME_START= DISC
LK_START_E1 = cdrom

NAME_SELECT = DISC NO LOGO
LK_SELECT_E1 = cdrom
ARG_SELECT_E1 = -nologo

##################################
