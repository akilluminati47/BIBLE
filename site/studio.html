<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>tvkit studio</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0a0d18; color: #dfe6fb; font: 14px system-ui, "Segoe UI", sans-serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; top: 12px; left: 12px; width: min(280px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; padding: 12px 14px;
        background: rgba(8, 12, 28, .82); border: 1px solid #2c3a66; border-radius: 10px; box-sizing: border-box; }
  h1 { font-size: 15px; margin: 0 0 8px; } label { display: block; margin: 8px 0 3px; color: #9fb0da; }
  select, input[type=range], button { width: 100%; box-sizing: border-box; }
  select, button { min-height: 36px; background: #141c38; color: inherit; border: 1px solid #33426f; border-radius: 6px; margin-top: 4px; }
  button { cursor: pointer; } #parts { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12px; columns: 2; }
  #dims { color: #9fb0da; font-size: 12px; margin-top: 8px; line-height: 1.5; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="ui">
  <h1>tvkit studio</h1>
  <label for="model">Model</label>
  <select id="model"><option value="crt">Sony KV-27V42</option><option value="lcd">BRAVIA, KDL-32V2500 era</option></select>
  <label for="spread">Exploded view</label>
  <input id="spread" type="range" min="0" max="1" step="0.01" value="0">
  <label><input id="spin" type="checkbox" checked style="width:auto"> Turntable</label>
  <label><input id="wire" type="checkbox" style="width:auto"> Wireframe</label>
  <button id="glb">Export .glb (opens in Blender)</button>
  <button id="png">Save a picture</button>
  <div id="dims"></div>
  <ul id="parts"></ul>
</div>
<script type="module" src="js/studio.js"></script>
</body>
</html>
